name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: bash -n mikrotik-adblock.sh

      - name: Smoke tests
        run: bash tests/smoke.sh

      - name: ShellCheck
        run: shellcheck mikrotik-adblock.sh tests/smoke.sh tests/mock-ssh.sh
